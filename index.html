<script>

const toISO=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const defaultState=()=>({settings:{region:'QLD',locality:'South Burnett',taxMode:'fixed',fixedTax:15,priorIncome:0,priorFY:'2026-27',payCycle:'weekly',superPct:12,displayMonth:new Date().getMonth(),displayYear:new Date().getFullYear(),extraHolidays:[]},jobs:[defaultJob()],records:[],payslips:[],schemaVersion:1});
let state=defaultState(),tab='calendar',db=null,storeOK=true,detailMonth=false;
function idbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB 不支持'));return}let req=indexedDB.open('shiftmate_local_v1',1);req.onupgradeneeded=()=>{let s=req.result.createObjectStore('app',{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function idbGet(db){return new Promise((res,rej)=>{let req=db.transaction('app','readonly').objectStore('app').get('state');req.onsuccess=()=>res(req.result?.value);req.onerror=()=>rej(req.error)})}
function idbSet(db,v){return new Promise((res,rej)=>{let req=db.transaction('app','readwrite').objectStore('app').put({key:'state',value:v});req.onsuccess=()=>res();req.onerror=()=>rej(req.error)})}
async function persist(){try{if(db)await idbSet(db,state);else{storeOK=false;throw Error('IndexedDB 不可用')}}catch(e){storeOK=false;toast('本地保存失败：请使用 HTTPS 托管地址并检查浏览器存储权限')} }

function toast(message){const r=$('#toastRoot');r.innerHTML=`<div class="toast">${safe(message)}</div>`;setTimeout(()=>{if(r)r.innerHTML=''},3300)}
function holidaySet(y){const out={};const add=(d,cn,en,about,from=0,to=24)=>{out[d]={cn,en,about,from,to}};
if(y===2026){
add('2026-01-01','元旦','New Year’s Day','澳大利亚全国公共假日，庆祝新年的开始。');add('2026-01-26','澳大利亚日','Australia Day','澳大利亚公共假日；这一天也有关于原住民历史与纪念方式的公共讨论。');add('2026-04-03','耶稣受难日','Good Friday','复活节前的星期五，基督教传统纪念日。');add('2026-04-04','复活节星期六','Easter Saturday','昆州复活节长周末的公共假日。');add('2026-04-05','复活节星期日','Easter Sunday','复活节星期日。');add('2026-04-06','复活节星期一','Easter Monday','复活节长周末公共假日。');add('2026-04-25','澳新军团日','Anzac Day','纪念澳大利亚和新西兰军人的纪念日。');add('2026-05-04','劳动节','Labour Day','昆士兰州劳动节。');add('2026-10-05','国王生日','King’s Birthday','昆州法定公共假日。');add('2026-12-24','平安夜（部分时段）','Christmas Eve (part day)','昆州公共假日仅 18:00–24:00。',18,24);add('2026-12-25','圣诞节','Christmas Day','纪念圣诞节的公共假日。');add('2026-12-26','节礼日','Boxing Day','圣诞节后的公共假日。');add('2026-12-28','节礼日补假','Additional Boxing Day holiday','因节礼日落在周末而增加的公共假日。');}
if(y===2027){
add('2027-01-01','元旦','New Year’s Day','新年公共假日。');add('2027-01-26','澳大利亚日','Australia Day','澳大利亚公共假日。');add('2027-03-26','耶稣受难日','Good Friday','复活节前星期五。');add('2027-03-27','复活节星期六','Easter Saturday','复活节长周末假日。');add('2027-03-28','复活节星期日','Easter Sunday','复活节星期日。');add('2027-03-29','复活节星期一','Easter Monday','复活节长周末公共假日。');add('2027-04-26','澳新军团日（补假）','Anzac Day observed','昆州将该日列为公共假日。');add('2027-05-03','劳动节','Labour Day','昆州劳动节。');add('2027-10-04','国王生日','King’s Birthday','昆州公共假日。');add('2027-12-24','平安夜（部分时段）','Christmas Eve (part day)','昆州 18:00–24:00 为公共假日。',18,24);add('2027-12-25','圣诞节','Christmas Day','圣诞节公共假日。');add('2027-12-27','圣诞节补假','Additional Christmas Day holiday','圣诞节周末补假。');add('2027-12-26','节礼日','Boxing Day','节礼日公共假日。');add('2027-12-28','节礼日补假','Additional Boxing Day holiday','节礼日周末补假。');}
if(state.settings.region==='QLD'){
if(state.settings.locality==='Brisbane'){if(y===2026)add('2026-08-12','皇家昆士兰展览会','Royal Queensland Show (Ekka)','仅布里斯班地区适用的 Ekka Show Day。');if(y===2027)add('2027-08-11','皇家昆士兰展览会','Royal Queensland Show (Ekka)','布里斯班 Ekka Show Day。')}
if(state.settings.locality==='South Burnett'&&y===2026)add('2026-08-10','南伯内特展览会假日','South Burnett Show Holiday','南伯内特地区为 Ekka 设置的地方性公共假日。');
}else{Object.keys(out).forEach(d=>delete out[d]);}
for(const item of state.settings.extraHolidays||[]){if(item.date.startsWith(y+'-'))add(item.date,item.cn||'自定义假日',item.en||'Custom holiday',item.about||'用户自定义特殊日期',Number(item.from??0),Number(item.to??24))}
return out}
function holiday(date){return holidaySet(Number(date.slice(0,4)))[date]||null}
function getJob(id){return state.jobs.find(j=>j.id===id)||state.jobs[0]||defaultJob()}
function rate(rule,base){rule=rule||{mode:'multiplier',value:1.5,add:0};if(rule.mode==='fixed')return Number(rule.value)||0;if(rule.mode==='combo')return base*(Number(rule.value)||0)+(Number(rule.add)||0);return base*(Number(rule.value)||0)}
function dateParts(startDate,st,ed){const d0=makeDate(startDate),start=Number(st.split(':')[0])*60+Number(st.split(':')[1]),e=Number(ed.split(':')[0])*60+Number(ed.split(':')[1]);return {start,end:e<=start?e+1440:e};}
function phHours(date,st,ed){const p=dateParts(date,st,ed);let mins=0;for(let shift=0;shift<=1;shift++){const d=addDays(date,shift);const h=holiday(d);if(!h)continue;const a=shift*1440+h.from*60,b=shift*1440+h.to*60;mins+=Math.max(0,Math.min(p.end,b)-Math.max(p.start,a));}return mins/60;}
function recordCalc(r){const totalRaw=Math.max(0,hoursBetween(r.start,r.end)-(Number(r.unpaidBreak)||0)/60);const total=fix(totalRaw);const rawPH=r.type!=='work'?0:(r.phOverride===''||r.phOverride==null?phHours(r.date,r.start,r.end):Number(r.phOverride)||0);const proportion=hoursBetween(r.start,r.end)>0?total/hoursBetween(r.start,r.end):0;const holidayH=Math.min(total,Math.max(0,rawPH*proportion));let overtime=r.type==='work'?Math.min(Number(r.otHours)||0,Math.max(0,total-holidayH)):0;const regular=fix(Math.max(0,total-holidayH-overtime));const ph=fix(holidayH);const base=Number(r.hourly)||0;
const job=getJob(r.jobId);const sat=dow(makeDate(r.date))===5,sun=dow(makeDate(r.date))===6;
const weekendPct=r.type!=='work'?0:(sat?Number(r.weekendSat||0):(sun?Number(r.weekendSun||0):0));
const nightPct=r.type!=='work'?0:Number(r.nightPercent)||0;
const normalW=regular*base;
let first=Math.min(overtime,Number(r.otFirstHours)||0);let later=overtime-first;
const otW=first*rate(r.ot1,base)+later*rate(r.ot2,base);
const phW=ph*rate(r.phVariant==='B'?r.phB:r.phA,base);
// Prototype convention: weekend and night loading apply only to ordinary hours to avoid automatic stacking on PH/OT.
const addons=regular*base*(weekendPct+nightPct)/100 + (Number(r.otherAllowance)||0);
const gross=fix(normalW+otW+phW+addons);
const superBase=normalW+addons+(r.type==='annual'||r.type==='sick'||r.type==='public-leave'?phW:0);
const superAmount=fix(Math.max(0,superBase)*(Number(r.superPct)||0)/100);
return {total,regular,ot:fix(overtime),ph,normalW:fix(normalW),otW:fix(otW),phW:fix(phW),addons:fix(addons),gross,superAmount};}
function fiscalYear(date){const yr=Number(date.slice(0,4)),mo=Number(date.slice(5,7));return mo>=7?`${yr}-${String(yr+1).slice(-2)}`:`${yr-1}-${String(yr).slice(-2)}`}
function whmTax(x){x=Math.max(0,x);return Math.min(x,45000)*.15+Math.max(0,Math.min(x-45000,90000))*.30+Math.max(0,Math.min(x-135000,55000))*.37+Math.max(0,x-190000)*.45}
function allRows(){return [...state.records].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));}
function taxAllocation(){const m={};const cum={};for(const r of allRows()){const fy=fiscalYear(r.date);if(cum[fy]==null)cum[fy]=(state.settings.priorFY===fy?Number(state.settings.priorIncome)||0:0);const gross=recordCalc(r).gross,tax=state.settings.taxMode==='fixed'?gross*(Number(state.settings.fixedTax)||0)/100:whmTax(cum[fy]+gross)-whmTax(cum[fy]);m[r.id]=fix(tax);cum[fy]+=gross;}return m}
function agg(rs,taxMap=taxAllocation()){const a={total:0,regular:0,ot:0,ph:0,normalW:0,otW:0,phW:0,addons:0,gross:0,tax:0,net:0,superAmount:0,entries:rs.length};for(const r of rs){const v=recordCalc(r);for(const k of ['total','regular','ot','ph','normalW','otW','phW','addons','gross','superAmount'])a[k]+=v[k];a.tax+=taxMap[r.id]||0}for(const k of Object.keys(a))a[k]=fix(a[k]);a.net=fix(a.gross-a.tax);return a}

function jobModal(id){const old=state.jobs.find(j=>j.id===id),j=old?structuredClone(old):{...defaultJob(),id:uid(),name:'新工作',days:[0,1,2,3,4],effectiveFrom:toISO(new Date())};
const ruleField=(key,title,rule)=>`<div class="grid3">${selectField(title+'模式',key+'Mode',[['multiplier','倍率 ×'],['fixed','固定时薪'],['combo','倍率＋固定额']],rule.mode)}${field('数值',key+'Value',rule.value,'number','step="0.01"')}${field('附加 $/h',key+'Add',rule.add||0,'number','step="0.01"')}</div>`;
let html=`<div class="modal-header"><h2>${old?'编辑':'新增'}工作预设</h2><button class="close">×</button></div><form id="jobForm"><div class="grid2">${field('工作名称','name',j.name)}${field('基本时薪 $','hourly',j.hourly,'number','min="0" step="0.01"')}${field('班次开始','start',j.start,'time')}${field('班次结束','end',j.end,'time')}${field('无薪休息 / 分钟','unpaidBreak',j.unpaidBreak,'number','min="0"')}${field('带薪休息 / 分钟','paidBreak',j.paidBreak,'number','min="0"')}${field('周六津贴 %','weekendSat',j.weekendSat,'number','step="0.01"')}${field('周日津贴 %','weekendSun',j.weekendSun,'number','step="0.01"')}${field('夜班津贴 %','nightPercent',j.nightPercent,'number','step="0.01"')}${field('Super 比例 %','superPct',j.superPct,'number','step="0.1"')}${field('生效日期','effectiveFrom',j.effectiveFrom,'date')}${field('加班第一阶段时数','otFirstHours',j.otFirstHours,'number','step="0.25"')}</div><div class="field"><label>默认工作日（周一至周日）</label><div class="checkdays">${DAYS.map((d,i)=>`<label><input type="checkbox" name="dow${i}" ${j.days.includes(i)?'checked':''}> ${d}</label>`).join('')}</div></div><details><summary class="btn" style="display:inline-block;margin:10px 0">展开自定义工资公式 ▾</summary>${ruleField('ot1','普通加班前段',j.ot1)}${ruleField('ot2','普通加班后段',j.ot2)}${ruleField('phA','节假日方案 A',j.phA)}${ruleField('phB','节假日方案 B',j.phB)}</details><div class="note caution">请根据自己的 Award、协议或雇主薪酬规则设置。倍率默认只是演示值。</div><div class="form-actions">${old?'<button type="button" class="btn warn" id="deleteJob">删除预设</button>':''}<button type="button" class="btn" id="cancelJob">取消</button><button class="btn primary" type="submit">保存预设</button></div></form>`;
openModal(html,true);const form=$('#jobForm');$('#cancelJob').onclick=closeModal;if(old)$('#deleteJob').onclick=()=>{if(state.jobs.length<=1){toast('至少保留一个工作预设');return}if(!confirm('删除此预设？历史工时记录保留。'))return;state.jobs=state.jobs.filter(x=>x.id!==old.id);saveAndRender();closeModal()};form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),n={...j,name:String(f.get('name')||'新工作'),start:f.get('start'),end:f.get('end'),effectiveFrom:f.get('effectiveFrom')};if(!n.name.trim()){toast('请输入工作名称');return}for(const k of ['hourly','unpaidBreak','paidBreak','weekendSat','weekendSun','nightPercent','superPct','otFirstHours'])n[k]=Number(f.get(k))||0;n.days=DAYS.map((_,i)=>i).filter(i=>f.get('dow'+i)==='on');for(const k of ['ot1','ot2','phA','phB'])n[k]={mode:f.get(k+'Mode'),value:Number(f.get(k+'Value'))||0,add:Number(f.get(k+'Add'))||0};if(old)state.jobs=state.jobs.map(x=>x.id===old.id?n:x);else state.jobs.push(n);saveAndRender();closeModal();toast('预设已保存；历史记录保持原来的工资规则')};}
function payslipsHTML(){const rows=[...state.payslips].sort((a,b)=>b.end.localeCompare(a.end));return `<div class="split-title"><div><h2 style="margin:0">工资单对账</h2><p class="subtle">录入实际 Payslip 与 APP 估算对照；每周或双周均可。</p></div><button class="btn primary" id="addPayslip">＋ 录入工资单</button></div><div class="surface"><div class="row"><div><strong>当前发薪周期</strong><p class="subtle">可在设置中修改</p></div><span class="chip">${state.settings.payCycle==='weekly'?'每周 Weekly':'双周 Fortnightly'}</span></div></div>`+(rows.map(p=>{const sum=agg(state.records.filter(r=>r.date>=p.start&&r.date<=p.end)),difference=fix(Number(p.gross)-sum.gross);return `<div class="surface"><div class="row"><div><h3>${p.start} ～ ${p.end}</h3><div class="subtle">${safe(p.employer||'工资单')}</div></div><button class="btn tiny" data-slip="${p.id}">编辑</button></div><div class="grid3"><div><div class="wd-label">APP 估算税前</div><b>${money(sum.gross)}</b></div><div><div class="wd-label">工资单税前</div><b>${money(p.gross)}</b></div><div><div class="wd-label">差额（实际−估算）</div><b style="color:${difference<0?'#b94e4e':'#167a71'}">${money(difference)}</b></div></div><div class="summary-line"><span>实际扣税</span><b>${money(p.tax)}</b></div><div class="summary-line"><span>实际实发</span><b>${money(p.net)}</b></div><div class="summary-line"><span>实际 Super</span><b>${money(p.super)}</b></div></div>`}).join('')||'<div class="surface empty">尚未录入工资单。点击「录入工资单」开始。</div>')+`<div class="note caution">差额不代表雇主一定算错；工资周期、舍入、津贴、扣款和适用工资协议都可能影响结果。</div>`}
function wirePayslips(){$('#addPayslip').onclick=()=>payslipModal();document.querySelectorAll('[data-slip]').forEach(b=>b.onclick=()=>payslipModal(b.dataset.slip))}
function payslipModal(id){const old=state.payslips.find(x=>x.id===id),p=old||{id:uid(),start:toISO(new Date()),end:toISO(new Date()),employer:'',gross:0,tax:0,net:0,super:0};let html=`<div class="modal-header"><h2>${old?'编辑':'新增'}工资单</h2><button class="close">×</button></div><form id="slipForm"><div class="grid2">${field('发薪区间起','start',p.start,'date')}${field('发薪区间止','end',p.end,'date')}${field('雇主 / 工作','employer',p.employer)}${field('实际税前工资 $','gross',p.gross,'number','step="0.01"')}${field('实际预扣税 $','tax',p.tax,'number','step="0.01"')}${field('实际到账工资 $','net',p.net,'number','step="0.01"')}${field('实际 Super $','super',p.super,'number','step="0.01"')}</div><div class="form-actions">${old?'<button class="btn warn" type="button" id="delSlip">删除</button>':''}<button class="btn" type="button" id="cancelSlip">取消</button><button class="btn primary" type="submit">保存工资单</button></div></form>`;openModal(html);const form=$('#slipForm');$('#cancelSlip').onclick=closeModal;if(old)$('#delSlip').onclick=()=>{state.payslips=state.payslips.filter(x=>x.id!==old.id);saveAndRender();closeModal()};form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),n={id:p.id,start:f.get('start'),end:f.get('end'),employer:f.get('employer')};for(const k of ['gross','tax','net','super'])n[k]=Number(f.get(k))||0;if(n.end<n.start){toast('结束日期不能早于开始日期');return}if(old)state.payslips=state.payslips.map(x=>x.id===old.id?n:x);else state.payslips.push(n);saveAndRender();closeModal()}}
function settingsHTML(){let s=state.settings,fy=fiscalYear(toISO(new Date()));return `<div class="surface"><h2>税务与地区</h2><div class="grid2">${selectField('澳洲州 / 领地','region',[['QLD','昆士兰 QLD'],['NSW','新南威尔士 NSW（需自行补录假日）'],['VIC','维多利亚 VIC（需自行补录假日）'],['WA','西澳 WA（需自行补录假日）'],['SA','南澳 SA（需自行补录假日）'],['TAS','塔州 TAS（需自行补录假日）'],['ACT','首都领地 ACT（需自行补录假日）'],['NT','北领地 NT（需自行补录假日）']],s.region)}${selectField('昆州地区','locality',[['South Burnett','South Burnett / Kingaroy'],['Brisbane','Brisbane'],['Other','昆州其他地区（未收录本地 Show Day）']],s.locality)}${selectField('估算扣税模式','taxMode',[['fixed','固定税率'],['whm','WHM 财年累计分段税率（年度税额估算）']],s.taxMode)}${field('固定扣税率 (%)','fixedTax',s.fixedTax,'number','step="0.1"')}${field('此前财年累计收入 $','priorIncome',s.priorIncome,'number','min="0" step="0.01"')}${field('此前收入适用财年（如 2026-27）','priorFY',s.priorFY)}${selectField('发薪周期','payCycle',[['weekly','Weekly · 每周'],['fortnightly','Fortnightly · 双周']],s.payCycle)}</div><div class="form-actions"><button class="btn primary" id="saveSettings">保存税务与地区</button></div><div class="note caution">2026、2027 年内置的是已核实的昆州公共假日，以及 2026 South Burnett / 2026–27 Brisbane Show Day。其它州、地区和年份并未完整覆盖。WHM 模式是年度应税额估算，不等于 ATO PAYG 每期预扣算法。假日/税务信息不会联网自动更新。</div></div>
<div class="surface"><div class="split-title"><h2>自定义节假日</h2><button class="btn" id="addHoliday">＋ 添加</button></div>${(s.extraHolidays||[]).map(h=>`<div class="metric"><span><strong>${safe(h.date)}</strong> · ${safe(h.cn)} <small>${safe(h.from??0)}:00–${safe(h.to??24)}:00</small></span><button class="btn tiny warn" data-hdelete="${safe(h.id)}">删除</button></div>`).join('')||'<p class="subtle">暂无自定义假日。</p>'}</div>
<div class="surface"><h2>🔒 本地隐私、导出与恢复</h2><div class="status">所有工作记录保存在当前浏览器的 IndexedDB 中。无云账户、无工资记录上传、无远程计算。</div><div class="panelbar" style="margin-top:13px"><button class="btn primary" id="backupBtn">导出加密备份</button><button class="btn" id="restoreBtn">从加密备份恢复</button><button class="btn" id="csvBtn">导出 Excel 兼容 CSV</button><button class="btn" id="clearBtn">清空本机全部记录</button></div><p class="subtle">加密备份使用浏览器 Web Crypto：PBKDF2（SHA-256）派生密钥＋AES-256-GCM。恢复会替换当前设备的本地数据。忘记密码无法恢复。请保管备份文件，并定期验证可恢复性。</p><p class="subtle">卸载浏览器、清除网站数据或手机损坏可能导致记录丢失。本地原始记录不是静态加密文件；设备本身需要设置锁屏密码。</p></div><div class="surface"><h2>关于此原型</h2><p class="subtle">版本 ${APP_VERSION}。只做本地存储与计算，不请求网络接口。首次加载 PWA 资源需要联网；在 HTTPS 环境安装成功后可离线打开。打开独立 HTML 文件时无法安装 Service Worker。</p><a class="muted-link" href="https://www.qld.gov.au/recreation/travel/holidays/public" target="_blank" rel="noreferrer">昆州政府公共假日官方表（需联网）</a><div style="height:7px"></div><a class="muted-link" href="https://www.ato.gov.au/tax-rates-and-codes/tax-rates-working-holiday-makers" target="_blank" rel="noreferrer">ATO Working Holiday Maker 税率（需联网）</a></div>`}
function wireSettings(){$('#saveSettings').onclick=()=>{for(const k of ['region','locality','taxMode','priorFY','payCycle'])state.settings[k]=document.getElementById(k).value;for(const k of ['fixedTax','priorIncome'])state.settings[k]=Number(document.getElementById(k).value)||0;saveAndRender();toast('设置已保存')};$('#addHoliday').onclick=holidayModal;document.querySelectorAll('[data-hdelete]').forEach(b=>b.onclick=()=>{state.settings.extraHolidays=state.settings.extraHolidays.filter(x=>x.id!==b.dataset.hdelete);saveAndRender()});$('#backupBtn').onclick=()=>backupModal('export');$('#restoreBtn').onclick=()=>backupModal('import');$('#csvBtn').onclick=exportCSV;$('#clearBtn').onclick=()=>{if(prompt('此操作不可撤销。请输入“清空”确认')!=='清空')return;state.records=[];state.payslips=[];saveAndRender();toast('已清空工时及工资单；保留工作预设')}}
function holidayModal(){const html=`<div class="modal-header"><h2>添加自定义节假日</h2><button class="close">×</button></div><form id="holidayForm"><div class="grid2">${field('日期','date',toISO(new Date()),'date')}${field('中文名称','cn','本地公共假日')}${field('英文名称','en','Local Public Holiday')}${field('开始时刻（0–24）','from',0,'number','min="0" max="24"')}${field('结束时刻（0–24）','to',24,'number','min="0" max="24"')}</div><div class="field"><label>简介</label><textarea name="about" rows="2"></textarea></div><div class="form-actions"><button class="btn primary" type="submit">保存假日</button></div></form>`;openModal(html);$('#holidayForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);let item={id:uid(),date:f.get('date'),cn:f.get('cn'),en:f.get('en'),from:Number(f.get('from')),to:Number(f.get('to')),about:f.get('about')};if(item.from>=item.to||item.to>24||item.from<0){toast('检查假日时间');return}state.settings.extraHolidays.push(item);saveAndRender();closeModal()}}
function dl(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function deriveKey(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function asB64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)}function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function backupModal(kind){let exporting=kind==='export';openModal(`<div class="modal-header"><h2>${exporting?'导出加密备份':'恢复加密备份'}</h2><button class="close">×</button></div><div class="note">备份只在本机加密或解密，不发送到网络。密码至少 8 位。</div><form id="backupForm">${exporting?'':`<div class="field"><label>加密备份文件 .shiftmate</label><input type="file" name="file" accept=".shiftmate,.json,application/json" required></div>`}${field('备份密码','pass','','password','minlength="8" required')}<div class="form-actions"><button class="btn primary" type="submit">${exporting?'生成加密文件':'验证密码并恢复'}</button></div></form>`);$('#backupForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),pass=String(f.get('pass'));if(pass.length<8){toast('密码至少 8 位');return}if(!crypto?.subtle){toast('请在 HTTPS 或 localhost 安全环境使用加密备份');return}try{if(exporting){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(pass,salt),payload=new TextEncoder().encode(JSON.stringify({app:'ShiftMate',version:1,exportedAt:new Date().toISOString(),state})),cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,payload));const out={format:'shiftmate-encrypted-v1',kdf:'PBKDF2-SHA256-250000',cipher:'AES-256-GCM',salt:asB64(salt),iv:asB64(iv),data:asB64(cipher)};dl(new Blob([JSON.stringify(out)],{type:'application/json'}),`shiftmate-${toISO(new Date())}.shiftmate`);toast('加密备份已导出')}else{const file=f.get('file');if(!file||!file.size){toast('请选择文件');return}const wrapper=JSON.parse(await file.text());if(wrapper.format!=='shiftmate-encrypted-v1')throw Error('不支持的备份格式');const key=await deriveKey(pass,fromB64(wrapper.salt));const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(wrapper.iv)},key,fromB64(wrapper.data));const payload=JSON.parse(new TextDecoder().decode(clear));if(payload.app!=='ShiftMate'||payload.version!==1||!payload.state?.records||!payload.state?.jobs||!payload.state?.settings)throw Error('备份文件结构异常');if(!confirm('确认以备份内容替换当前设备的全部工时和设置？建议先导出当前备份。'))return;state=payload.state;await persist();render();toast('备份恢复成功')}closeModal()}catch(err){toast(`无法${exporting?'备份':'恢复'}：${err.message||'密码或文件错误'}`)}}}
function exportCSV(){const cols=['日期','工作名称','类型','上班时间','下班时间','无薪休息分钟','正常工时','普通加班工时','公共假日工时','基本时薪','正常工资','加班工资','公共假日工资','津贴','税前工资','估算税额','估算税后','Super估算','备注'];const tax=taxAllocation();const esc=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=[cols.join(',')];for(const r of allRows()){const c=recordCalc(r);rows.push([r.date,r.jobName,r.type,r.start,r.end,r.unpaidBreak,c.regular,c.ot,c.ph,r.hourly,c.normalW,c.otW,c.phW,c.addons,c.gross,tax[r.id]||0,fix(c.gross-(tax[r.id]||0)),c.superAmount,r.note].map(esc).join(','))}dl(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),`shiftmate-records-${toISO(new Date())}.csv`);toast('CSV 已导出，可使用 Excel 打开')}
async function boot(){try{db=await idbOpen();const data=await idbGet(db);if(data?.records&&data?.jobs&&data?.settings){state=data;state.settings.extraHolidays??=[];state.payslips??=[]}}catch(e){storeOK=false;console.warn('IndexedDB unavailable',e);setTimeout(()=>toast('本地存储不可用，当前数据可能无法保留；请改用 HTTPS 部署地址'),400)}render();if('serviceWorker'in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});} }
boot();
</script></body></html>
